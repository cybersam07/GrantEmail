<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email confirmation request</title>
<style>
:root{--blue:#1a4480;--dark:#162e51;--muted:#565c65;--bg:#f5f5f5;--border:#dfe1e2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1b1b1b;background:var(--bg)}header{background:white;border-bottom:1px solid var(--border)}.head{width:min(1100px,calc(100% - 32px));margin:auto;min-height:90px;display:flex;align-items:center}.logo{color:var(--dark);font-size:1.5rem;font-weight:700;text-decoration:none}main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}.card{width:min(560px,100%);padding:36px;background:white;border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 8px #0001}h1{margin:0 0 12px;color:var(--dark)}p{color:var(--muted);line-height:1.6}label{display:block;margin:20px 0 6px;font-weight:650}input[type=email]{width:100%;min-height:46px;padding:10px 12px;border:1px solid #8b929a;border-radius:4px;font:inherit}input:focus{outline:3px solid #8bb8e8;outline-offset:1px}.button{margin-top:18px;padding:12px 20px;border:0;border-radius:4px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}.note,.foot{font-size:.92rem}.foot{padding:24px;text-align:center;color:var(--muted)}
</style></head><body><header><div class="head"><a class="logo" href="/">Registration</a></div></header><main><section class="card">
<h1>Confirm your email address</h1><p>Enter your email address you used during Registration</p>
<form name="email-confirmation-request" method="POST" action="./success.html" netlify-honeypot="bot-field">
<input type="hidden" name="form-name" value="email-confirmation-request"><p hidden><label>Leave this field empty: <input name="bot-field"></label></p>
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
<button class="button" type="submit">Submit email</button></form>
</section></main>
<footer class="footer">
      <a
        class="footer-logo"
        href="/"
        aria-label="Registration home">
        <img
          src="./images/grants-gov-logo-w.png"
          alt="Registration logo"
        >
      </a>

      <p class="footer-copy">
        Registration Portal
      </p>
</footer>
</body>
</html>
